name: Release

# Each new version in orca-plugin.json that reaches main becomes a tag and a GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Manifest version and changelog agree
        id: version
        run: |
          scripts/version-check.sh > "$RUNNER_TEMP/notes.md"
          echo "tag=v$(node -p "require('./orca-plugin.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish the release when the version is new
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Swampling $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
