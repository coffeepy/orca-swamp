name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests need Orca's own test files, which a runner does not have: scripts/release.sh runs them.
      - name: Manifest version and changelog agree
        run: scripts/version-check.sh
      - name: Shell scripts are valid
        run: shellcheck scripts/*.sh
